<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostRead — Post-Read Summary</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
      GhostRead
      <span class="badge">Summary</span>
    </a>
    <ul class="nav-links">
      <li><a href="/">My Library</a></li>
      <li><a href="/dashboard.html">Dashboard</a></li>
      <li><a href="/explain.html">Explain This App</a></li>
    </ul>
    <div class="nav-user">
      <button class="btn btn-secondary btn-sm" onclick="API.logout()">Log Out</button>
    </div>
  </nav>

  <div class="container" style="max-width: 800px;">
    <!-- Loading state -->
    <div id="loading" style="text-align: center; padding: 4rem 1rem;">
      <h2 style="font-size: 1.3rem; font-weight: 700; color: #0f172a;">Analyzing Reading Behavior...</h2>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Evaluating dwell times, text densities, and scroll patterns (< 3s requirement)</p>
    </div>

    <!-- Main Content -->
    <div id="content" style="display: none;">
      <div style="margin-bottom: 2rem;">
        <span style="font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: var(--primary); letter-spacing: 0.05em;">Session Complete</span>
        <h1 id="doc-title" style="font-size: 1.85rem; font-weight: 800; color: #0f172a; margin-top: 0.25rem;">
          Reading Summary
        </h1>
        <p id="doc-date" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;"></p>
      </div>

      <!-- Action Card depending on Skimmed count -->
      <div id="action-card" class="card" style="box-shadow: var(--shadow-md);">
        <!-- Filled dynamically -->
      </div>

      <!-- Section Status Breakdown Cards -->
      <div class="card">
        <h2 class="card-title" style="margin-bottom: 1rem;">Section-by-Section Comprehension Signals</h2>
        <div id="sections-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
          <!-- Section rows filled dynamically -->
        </div>
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 2rem;">
        <a href="/" class="btn btn-secondary" style="flex: 1;">Back to Library</a>
        <a href="/dashboard.html" class="btn btn-secondary" style="flex: 1;">View Analytics Dashboard &rarr;</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');

    if (!sessionId) {
      window.location.href = '/';
    }

    async function loadSummary() {
      try {
        const user = await API.getCurrentUser();
        if (!user) {
          window.location.href = '/login.html';
          return;
        }

        const data = await API.get(`/api/sessions/${sessionId}`);
        const session = data.session;
        const classifications = data.classifications;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        document.getElementById('doc-title').textContent = session.document_title;
        document.getElementById('doc-date').textContent = `Finished on ${new Date(session.end_time || session.start_time).toLocaleString()}`;

        // Count statuses
        let skimmed = 0, read = 0, reread = 0, reinforced = 0;
        for (const c of classifications) {
          if (c.status === 'Skimmed') skimmed++;
          else if (c.status === 'Genuinely Read') read++;
          else if (c.status === 'Reread') reread++;
          else if (c.status === 'Reinforced') reinforced++;
        }

        const actionCard = document.getElementById('action-card');
        if (skimmed > 0) {
          // REQ-4.1: Skimmed sections exist -> prompt micro-quiz
          actionCard.style.borderLeft = '6px solid var(--status-skimmed)';
          actionCard.innerHTML = `
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 1.5rem;">
              <div>
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                  <span style="font-size: 1.25rem;">⚠️</span>
                  <h3 style="font-size: 1.2rem; font-weight: 800; color: #991b1b;">
                    ${skimmed} Skimmed Section${skimmed > 1 ? 's' : ''} Detected
                  </h3>
                </div>
                <p style="color: #475569; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1rem;">
                  Our behavioral classifier detected rapid scrolling or insufficient dwell time on ${skimmed} section${skimmed > 1 ? 's' : ''}.
                  Take a quick targeted micro-quiz on only these sections to test and reinforce your recall!
                </p>
                <a href="/quiz.html?session=${sessionId}" class="btn btn-primary" style="padding: 0.75rem 1.5rem; font-size: 1rem;">
                  🎯 Start Targeted Micro-Quiz (${skimmed * 2} Questions)
                </a>
              </div>
            </div>
          `;
        } else {
          // REQ-4.2: No sections skimmed -> skip quiz
          actionCard.style.borderLeft = '6px solid var(--status-read)';
          actionCard.innerHTML = `
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 1.5rem;">
              <div>
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                  <span style="font-size: 1.25rem;">🎉</span>
                  <h3 style="font-size: 1.2rem; font-weight: 800; color: #065f46;">
                    You read everything properly!
                  </h3>
                </div>
                <p style="color: #475569; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1rem;">
                  All sections met or exceeded expected dwell times and steady reading velocity relative to text density.
                  No targeted quiz is needed for this session.
                </p>
                <a href="/dashboard.html" class="btn btn-primary" style="background: var(--status-read);">
                  📊 View in Comprehension Dashboard
                </a>
              </div>
            </div>
          `;
        }

        // Render section list
        const listEl = document.getElementById('sections-list');
        listEl.innerHTML = classifications.map(c => {
          let badgeClass = 'status-read';
          if (c.status === 'Skimmed') badgeClass = 'status-skimmed';
          else if (c.status === 'Reread') badgeClass = 'status-reread';
          else if (c.status === 'Reinforced') badgeClass = 'status-reinforced';

          return `
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: #ffffff;">
              <div style="display: flex; align-items: center; gap: 1rem;">
                <div style="font-weight: 700; font-size: 1rem; width: 90px; color: #0f172a;">
                  Section ${c.section_number}
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">
                  Page ${c.page_number} &bull; ${c.word_count} words &bull; Dwell: ${c.dwell_time_seconds.toFixed(1)}s &bull; Rel Speed: ${c.relative_scroll_speed.toFixed(2)}x
                </div>
              </div>

              <div>
                <span class="heatmap-block ${badgeClass}" style="padding: 0.35rem 0.75rem; border-radius: 999px; aspect-ratio: auto; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">
                  ${c.status}
                </span>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Failed to load summary:', err);
        alert('Failed to load session summary: ' + err.message);
        window.location.href = '/';
      }
    }

    loadSummary();
  </script>
</body>
</html>
